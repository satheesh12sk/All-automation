name: Smoke Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-e2e.js --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports
          path: |
            playwright-report/
            tta-report/
